<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.3;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 60px;
      box-shadow: 0 20px 60px rgba(233, 30, 99, 0.3);
      animation: fadeInUp 1s ease-out;
      max-width: 500px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .big-heart {
      font-size: 80px;
      animation: heartbeat 1.2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    h1 {
      font-size: 2.2rem;
      color: #c2185b;
      margin: 20px 0 10px;
      line-height: 1.3;
    }

    .subtitle {
      color: #e91e63;
      font-size: 1.1rem;
      margin-bottom: 35px;
      font-style: italic;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      min-height: 80px;
      position: relative;
    }

    .btn-yes {
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 1.3rem;
      font-family: 'Georgia', serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 30px rgba(233, 30, 99, 0.6);
    }

    .btn-no {
      background: linear-gradient(135deg, #bdbdbd, #9e9e9e);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 1.3rem;
      font-family: 'Georgia', serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    /* Success screen */
    .success-screen {
      display: none;
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    .success-screen.show {
      display: block;
    }

    .success-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 60px;
      box-shadow: 0 20px 60px rgba(233, 30, 99, 0.3);
      max-width: 550px;
    }

    .success-heart {
      font-size: 100px;
      animation: heartbeat 1.2s ease-in-out infinite;
      display: inline-block;
    }

    .success-title {
      font-size: 2.5rem;
      color: #c2185b;
      margin: 20px 0;
    }

    .success-text {
      font-size: 1.3rem;
      color: #e91e63;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .success-subtext {
      font-size: 1rem;
      color: #f06292;
      font-style: italic;
      margin-top: 15px;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-10vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg);
      }
    }

    .attempt-counter {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #f06292;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Question screen -->
  <div class="container" id="questionScreen">
    <div class="question-card">
      <div class="big-heart">&#10084;&#65039;</div>
      <h1>Will You Be My Valentine?</h1>
      <p class="subtitle">I had to ask you the most important question...</p>
      <div class="buttons">
        <button class="btn-yes" onclick="sayYes()">Yes!</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
      </div>
      <div class="attempt-counter" id="attemptText"></div>
    </div>
  </div>

  <!-- Success screen -->
  <div class="success-screen" id="successScreen">
    <div class="success-card">
      <div class="success-heart">&#128149;</div>
      <h1 class="success-title">Yaaay! &#127881;</h1>
      <p class="success-text">
        This is your best choice! &#10084;&#65039;<br>
        I knew you'd say yes!<br>
        You just made me the happiest person ever!
      </p>
      <p class="success-subtext">
        Happy Valentine's Day, my love &#127801;<br>
        You mean the world to me.
      </p>
    </div>
  </div>

  <script>
    // Create floating hearts in the background
    const heartsBg = document.getElementById('heartsBg');
    const heartEmojis = ['\u2764\uFE0F', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83D\uDC97', '\uD83D\uDC98', '\uD83D\uDC9D', '\uD83C\uDF39'];

    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
      heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
      heart.style.animationDelay = (Math.random() * 10) + 's';
      heartsBg.appendChild(heart);
    }

    // No button escape logic
    const noBtn = document.getElementById('noBtn');
    const attemptText = document.getElementById('attemptText');
    let noAttempts = 0;

    const funnyMessages = [
      "Haha, nice try!",
      "Nope, that's not an option!",
      "You really thought? Think again!",
      "The button says no but I say YES!",
      "Come on, you know the answer!",
      "Stop chasing that button!",
      "Just press Yes already! \u2764\uFE0F",
      "That button is scared of you!",
      "It's running away from you!",
      "You can't catch it! Just say Yes!"
    ];

    function moveNoButton() {
      noAttempts++;

      // Get viewport dimensions with some padding
      const padding = 20;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      // Random new position
      const newX = Math.floor(Math.random() * maxX) + padding;
      const newY = Math.floor(Math.random() * maxY) + padding;

      // Move the button to a fixed position on screen
      noBtn.style.position = 'fixed';
      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';

      // Show funny message
      const msgIndex = Math.min(noAttempts - 1, funnyMessages.length - 1);
      attemptText.textContent = funnyMessages[msgIndex];

      // Make yes button bigger after several attempts
      const yesBtn = document.querySelector('.btn-yes');
      const scale = 1 + (noAttempts * 0.08);
      yesBtn.style.transform = `scale(${Math.min(scale, 1.8)})`;
    }

    // Success function
    function sayYes() {
      document.getElementById('questionScreen').style.display = 'none';
      noBtn.style.display = 'none';
      const successScreen = document.getElementById('successScreen');
      successScreen.classList.add('show');

      // Change background to something more festive
      document.body.style.background = 'linear-gradient(135deg, #fce4ec, #f8bbd0, #ff80ab)';

      // Launch confetti
      launchConfetti();
    }

    function launchConfetti() {
      const confettiColors = ['#e91e63', '#f44336', '#ff4081', '#ff80ab', '#f8bbd0', '#FFD700', '#FF69B4', '#ff1744'];
      const confettiShapes = ['\u2764\uFE0F', '\uD83D\uDC96', '\u2728', '\uD83C\uDF1F', '\uD83C\uDF39', '\uD83E\uDE77'];

      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.classList.add('confetti-piece');
          confetti.textContent = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.fontSize = (Math.random() * 20 + 12) + 'px';
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(confetti);

          // Remove after animation
          setTimeout(() => confetti.remove(), 4000);
        }, i * 80);
      }
    }
  </script>

</body>
</html>
